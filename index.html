<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manager Roster Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a shift board. Sticky toolbar, one strip of seven day cards per week, checks + shift counts underneath. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d4dbe5; --fg:#18212e; --muted:#5d6878;
  --accent:#1f4f8f; --accent-fg:#ffffff; --accent-soft:#dce7f6;
  --day:#c97a12; --day-soft:#fbefd9; --mid:#1a8378; --mid-soft:#d8f0ec; --night:#4b44a8; --night-soft:#e3e1f7;
  --train:#a3286a; --train-soft:#f9e0ec; --event:#3b6b12; --event-soft:#e6f2dc;
  --bad:#b4322a; --bad-soft:#fbe3e0; --warn:#9a6a00; --warn-soft:#fbf0cf; --ok:#2d7a3e; --ok-soft:#dff1e2;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161e; --surface:#19202b; --surface-2:#222b38; --line:#323d4d; --fg:#e6ebf2; --muted:#9aa6b6;
  --accent:#7fa9e8; --accent-fg:#0d1420; --accent-soft:#1f3150;
  --day:#f0a94a; --day-soft:#3a2c17; --mid:#4cc3b4; --mid-soft:#16352f; --night:#a49ef2; --night-soft:#28264a;
  --train:#f29cc4; --train-soft:#3a1f2c; --event:#a6d98f; --event-soft:#1f3318;
  --bad:#f08a80; --bad-soft:#3d1d1b; --warn:#e8c25a; --warn-soft:#3a3016; --ok:#7bcf8c; --ok-soft:#1b3420;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161e; --surface:#19202b; --surface-2:#222b38; --line:#323d4d; --fg:#e6ebf2; --muted:#9aa6b6;
  --accent:#7fa9e8; --accent-fg:#0d1420; --accent-soft:#1f3150;
  --day:#f0a94a; --day-soft:#3a2c17; --mid:#4cc3b4; --mid-soft:#16352f; --night:#a49ef2; --night-soft:#28264a;
  --train:#f29cc4; --train-soft:#3a1f2c; --event:#a6d98f; --event-soft:#1f3318;
  --bad:#f08a80; --bad-soft:#3d1d1b; --warn:#e8c25a; --warn-soft:#3a3016; --ok:#7bcf8c; --ok-soft:#1b3420;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:24px;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.period .label{font-family:var(--f-display);font-size:18px;font-weight:600;min-width:0;white-space:nowrap}
#pstart,#pweeks{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 6px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.icon{padding:6px 9px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .spacer{flex:1}
.status{font-size:14px;color:var(--muted)}
.status.good{color:var(--ok)} .status.bad{color:var(--bad)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.week{display:flex;flex-direction:column;gap:8px}
.week h2{font-size:18px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.week h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.scroller{overflow-x:auto;padding-bottom:4px}
.days{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1080px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dcard.fri{border-color:var(--mid)}
.dcard.special{border-color:var(--event)}
.dcard.closed{background:var(--surface-2)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:6px;width:100%;border:0;background:transparent;padding:2px 4px;border-radius:5px;cursor:pointer;text-align:left}
.dhead:hover{background:var(--surface-2)}
.dhead:hover span{color:var(--accent)}
.dhead b{font-family:var(--f-display);font-size:17px;font-weight:600}
.dhead span{color:var(--muted);font-size:12px}
.dlabel{font-size:12px;font-weight:600;line-height:1.3;color:var(--event);background:var(--event-soft);border-radius:4px;padding:3px 6px;overflow-wrap:anywhere}
.closednote{font-size:13px;font-weight:600;color:var(--muted);text-align:center;padding:8px 0;border:1px dashed var(--line);border-radius:5px}
.slot{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:4px;border-radius:6px;padding:3px 3px 3px 0}
.slot .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 0;text-align:center;border-radius:4px}
.slot.day .tag{background:var(--day-soft);color:var(--day)}
.slot.mid .tag{background:var(--mid-soft);color:var(--mid)}
.slot.night .tag{background:var(--night-soft);color:var(--night)}
.slot.trainee .tag{background:var(--train-soft);color:var(--train)}
.slot select{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 4px;font-size:14px}
.slot.empty select{border-style:dashed;color:var(--muted)}
.slot.trainee.empty select{border-style:dotted}
.slot.flag select{border-color:var(--bad);background:var(--bad-soft)}
.slot.pinned select{border-color:var(--accent);font-weight:600}
.pin{border:0;background:transparent;cursor:pointer;padding:3px;border-radius:4px;color:var(--muted);opacity:.35;line-height:0}
.pin[aria-pressed="true"]{color:var(--accent);opacity:1}
.pin:hover{opacity:1}
.specials{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500;cursor:pointer}
.chip:hover{border-color:var(--event);color:var(--event)}
.chip[aria-pressed="true"]{background:var(--event-soft);border-color:var(--event);color:var(--event);font-weight:600}
.chip.special{background:var(--event-soft);border-color:transparent;color:var(--event);font-weight:600}
.chip.special:hover{border-color:var(--event)}
.dayedit{border-color:var(--event);box-shadow:0 0 0 1px var(--event)}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}
@media (max-width:860px){.panels{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:19px;font-weight:600}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.issues li{padding:6px 10px;border-radius:6px;background:var(--warn-soft);color:var(--fg);border-left:3px solid var(--warn)}
.issues li.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.issues li.ok{background:var(--ok-soft);border-left-color:var(--ok)}
.issues li.info{background:var(--accent-soft);border-left-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
td.short{color:var(--bad);font-weight:700}
td.zero{color:var(--warn);font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.pill.contract{background:var(--accent-soft);color:var(--accent)}
.pill.casual{background:var(--surface-2);color:var(--muted)}
.pill.trainee{background:var(--train-soft);color:var(--train)}
.pill.trainer{box-shadow:inset 0 0 0 1px var(--train);color:var(--train)}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
/* Managers */
.mgr-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.mgr-layout{grid-template-columns:minmax(0,1fr)}}
.mlist{display:flex;flex-direction:column;gap:6px}
.mitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.mitem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.mitem .n{font-weight:600}
.mitem .meta{font-size:12px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field input[type=text],.field input[type=number],.field input[type=date],.field select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px}
.field input[type=number]{width:90px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;width:fit-content}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.avail th,.avail td{padding:5px 8px}
.avail input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.hint{font-size:13px;color:var(--muted);max-width:65ch}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;background:var(--surface-2);font-size:14px}
.exlist .off{color:var(--bad);font-weight:600}
.exlist .on{color:var(--ok);font-weight:600}
.exlist b{font-weight:600}
.exlist .exn{color:var(--muted)}
.exlist li.past{opacity:.6}
.checks{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding-bottom:7px}
.checks label{display:inline-flex;gap:5px;align-items:center;font-size:14px}
.empty-state{padding:30px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.confirm{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.busy{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.busy{animation:none}}
.savestate{font-size:12px;color:var(--muted)}
.sheet{border-collapse:separate;border-spacing:0;font-size:14px;min-width:900px;width:100%;table-layout:fixed}
.sheet col.c-name{width:140px}
.sheet tr.wh th{white-space:normal}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 10px;text-align:center}
.sheet tr.wh th{background:var(--accent-soft);color:var(--accent);font-size:13px;text-transform:none;letter-spacing:0;border-top:1px solid var(--line)}
.sheet tr.wh th.wk{background:var(--accent);color:var(--accent-fg);text-align:left;font-family:var(--f-display);font-size:16px}
.sheet th.nm{text-align:left;font-weight:600;color:var(--fg);text-transform:none;letter-spacing:0;font-size:14px;background:var(--surface)}
.sheet th:first-child,.sheet td:first-child{border-left:1px solid var(--line);position:sticky;left:0;z-index:1}
.sheet td{background:var(--surface);font-weight:700;min-width:110px}
.sheet td.s-day{background:var(--day-soft);color:var(--day)}
.sheet td.s-mid{background:var(--mid-soft);color:var(--mid)}
.sheet td.s-night{background:var(--night-soft);color:var(--night)}
.sheet td.s-train{background:var(--train-soft);color:var(--train);font-size:12px;letter-spacing:.04em}
.sheet td.s-off{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.sheet td.s-closed{background:var(--surface-2)}
.sheet tr.lr td{font-size:12.5px;font-weight:600;white-space:normal;line-height:1.3}
.sheet td.s-note{background:var(--event-soft);color:var(--event)}
.sheet tr.gap td{border:0;background:transparent;height:14px;padding:0}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Manager Roster</h1><span class="savestate" id="savestate"></span></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-roster" data-tab="roster">Roster</button>
    <button role="tab" id="tab-team" data-tab="team">Managers</button>
    <button role="tab" id="tab-sheet" data-tab="sheet">Sheet</button>
  </div>
  <div class="period">
    <button class="btn icon" id="prev" aria-label="Previous roster">‹</button>
    <span class="label" id="plabel"></span>
    <button class="btn icon" id="next" aria-label="Next roster">›</button>
    <input type="date" id="pstart" aria-label="Roster start date">
    <select id="pweeks" aria-label="Roster length">
      <option value="1">1 week</option><option value="2">2 weeks</option><option value="3">3 weeks</option><option value="4">4 weeks</option>
      <option value="5">5 weeks</option><option value="6">6 weeks</option><option value="7">7 weeks</option><option value="8">8 weeks</option>
    </select>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAYS_FULL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SHIFTS=["day","mid","night"];
const SHIFT_NAME={day:"Day",mid:"Mid",night:"Night"};
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LS_KEY="mgr-roster-state-v1";
const MAX_WEEKS=8;
const PRESET_LABELS=["Christmas Eve","Christmas Day","Boxing Day","New Year's Eve","New Year's Day","Store Christmas party"];
const HOLIDAYS={"12-24":"Christmas Eve","12-25":"Christmas Day","12-26":"Boxing Day","12-31":"New Year's Eve","01-01":"New Year's Day"};

/* ---------- dates (UTC math, so daylight saving never shifts a day) ---------- */
const toD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d));};
const fromD=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return fromD(d);};
const dow=s=>(toD(s).getUTCDay()+6)%7; // Mon=0
const fmt=s=>{const d=toD(s);return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;};
const fmtY=s=>{const d=toD(s);return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;};
const daysBetween=(a,b)=>Math.round((toD(b)-toD(a))/86400000);
function todayISO(){const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;}
const isDate=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s);
function nextMonday(){const t=new Date();let s=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;while(dow(s)!==0)s=addDays(s,1);return s;}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clampWeeks=n=>Math.min(MAX_WEEKS,Math.max(1,parseInt(n,10)||4));
const holidayName=d=>HOLIDAYS[d.slice(5)]||"";

/* ---------- state ---------- */
const blankWeek=()=>DAYS.map((_,i)=>({day:true,mid:i===4,night:true}));
function newManager(name){return{id:uid(),name:name||"New manager",type:"casual",min:0,max:null,trainee:false,canTrain:false,week:blankWeek(),exceptions:[]};}
let state={version:2,managers:[],slots:{},days:{},start:nextMonday(),weeks:4,periods:{},tab:"roster",example:false};
let ui={shadeOff:true,sel:null,confirm:null,status:null,busy:false,exStatus:"off",exMode:"one",dayDraft:null};

function normalize(s){
  s=s&&typeof s==="object"?s:{};
  const out={version:2,managers:Array.isArray(s.managers)?s.managers:[],slots:{},days:{},
    start:isDate(s.start)?s.start:nextMonday(),weeks:clampWeeks(s.weeks??4),periods:{},
    tab:["team","sheet"].includes(s.tab)?s.tab:"roster",example:!!s.example};
  if(s.slots&&typeof s.slots==="object")for(const k in s.slots){const v=s.slots[k];if(v&&typeof v.m==="string")out.slots[k]={m:v.m,locked:!!v.locked};}
  if(s.days&&typeof s.days==="object")for(const k in s.days){
    const v=s.days[k];if(!isDate(k)||!v||typeof v!=="object")continue;
    const label=typeof v.label==="string"?v.label.trim().slice(0,80):"";
    const shifts=v.shifts&&typeof v.shifts==="object"?{day:!!v.shifts.day,mid:!!v.shifts.mid,night:!!v.shifts.night}:null;
    if(label||shifts)out.days[k]={label,shifts};
  }
  if(s.periods&&typeof s.periods==="object")for(const k in s.periods)if(isDate(k))out.periods[k]=clampWeeks(s.periods[k]);
  out.managers=out.managers.map(m=>({id:m.id||uid(),name:m.name||"Unnamed",type:m.type==="contract"?"contract":"casual",min:Number(m.min)||0,
    max:m.max===null||m.max===undefined||m.max===""?null:Number(m.max),
    trainee:!!m.trainee,canTrain:!!m.canTrain,
    week:Array.isArray(m.week)&&m.week.length===7?m.week.map(w=>({day:!!w.day,mid:!!w.mid,night:!!w.night})):blankWeek(),
    exceptions:Array.isArray(m.exceptions)?m.exceptions.filter(e=>isDate(e.date)).map(e=>({id:e.id||uid(),date:e.date,to:isDate(e.to)&&e.to>e.date?e.to:null,status:e.status==="on"?"on":"off",shifts:{day:!!e.shifts?.day,mid:!!e.shifts?.mid,night:!!e.shifts?.night}})):[],
    example:!!m.example}));
  return out;
}

/* ---------- persistence: this browser, plus backup files ---------- */
const downloads={save:async({filename,data})=>{
  const blob=data instanceof Blob?data:new Blob([data]);
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"};}};
function lsGet(){try{const v=localStorage.getItem(LS_KEY);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));return true;}catch(e){return false;}}
function setSaveState(t){document.getElementById("savestate").textContent=t;}
function persistable(){return{version:2,managers:state.managers,slots:state.slots,days:state.days,start:state.start,weeks:state.weeks,periods:state.periods,tab:state.tab,example:state.example};}
function save(){state.periods[state.start]=state.weeks;setSaveState(lsSet(persistable())?"Saved in this browser":"Couldn't save in this browser. Download a backup");}

/* ---------- days, shifts and availability ---------- */
const mById=id=>state.managers.find(m=>m.id===id);
const defaultShifts=d=>dow(d)===4?["day","mid","night"]:["day","night"];
function shiftsFor(d){const o=state.days[d];return o&&o.shifts?SHIFTS.filter(s=>o.shifts[s]):defaultShifts(d);}
const sameShifts=(a,b)=>a.length===b.length&&a.every((s,i)=>s===b[i]);
function dayNote(d){
  const o=state.days[d];if(!o)return "";
  const parts=[];if(o.label)parts.push(o.label);
  const sh=shiftsFor(d);
  if(!sh.length)parts.push("Closed");
  else if(o.shifts&&!sameShifts(sh,defaultShifts(d)))parts.push(sh.length===1?`${SHIFT_NAME[sh[0]]} shift only`:`${sh.map(s=>SHIFT_NAME[s]).join(" + ")} shifts`);
  return parts.join(" · ");
}
// Mid shifts on days other than Friday only happen on special days; anyone free for that day's day shift can cover them.
// The exception that applies on a date: an exception covers one day (date) or a range (date to "to"); where several cover it, the one added last wins.
function exceptionFor(m,date){let ex=null;for(const e of m.exceptions)if(e.date<=date&&date<=(e.to||e.date))ex=e;return ex;}
function avail(m,date,shift){
  const ex=exceptionFor(m,date);
  const fri=dow(date)===4;
  if(ex){if(ex.status!=="on")return false;if(shift==="mid"&&!fri)return !!(ex.shifts.mid||ex.shifts.day);return !!ex.shifts[shift];}
  if(shift==="mid"&&!fri)return !!m.week[dow(date)].day;
  return !!m.week[dow(date)][shift];
}
function isAvailAny(m,d){const sh=shiftsFor(d);return m.trainee?sh.includes("night")&&avail(m,d,"night"):sh.some(s=>avail(m,d,s));}
function windowDates(start,weeks){return Array.from({length:(weeks||state.weeks)*7},(_,i)=>addDays(start,i));}
const periodEnd=()=>addDays(state.start,state.weeks*7-1);
const periodText=()=>`${fmt(state.start)} – ${fmtY(periodEnd())}`;
// The manager on a shift, only if that shift exists on that date. "trainee" is the training spot on a night.
function slotMgr(date,shift){
  const sh=shiftsFor(date);
  if(shift==="trainee"?!sh.includes("night"):!sh.includes(shift))return null;
  const v=state.slots[date+":"+shift];return v&&mById(v.m)?v.m:null;
}
function slotKeys(d){const sh=shiftsFor(d);return [...sh,...(sh.includes("night")?["trainee"]:[])].map(s=>d+":"+s);}
function pruneDay(d){for(const s of [...SHIFTS,"trainee"]){const k=d+":"+s;if(!slotKeys(d).includes(k))delete state.slots[k];}}

/* ---------- generator ---------- */
function generate(start){
  const M=state.managers, nM=M.length, idx=new Map(M.map((m,i)=>[m.id,i]));
  const W=state.weeks, nD=W*7, dates=windowDates(start), slots=[], slotAt=dates.map(()=>({}));
  const isTrainee=M.map(m=>!!m.trainee), isTrainer=M.map(m=>!m.trainee&&!!m.canTrain), anyTrainee=isTrainee.some(Boolean);
  dates.forEach((d,di)=>{
    const sh=shiftsFor(d), week=(di/7)|0;
    for(const s of sh){slotAt[di][s]=slots.length;slots.push({key:d+":"+s,date:d,di,shift:s,week,train:false});}
    if(anyTrainee&&sh.includes("night")){slotAt[di].trainee=slots.length;slots.push({key:d+":trainee",date:d,di,shift:"trainee",week,train:true});}
  });
  const N=slots.length, A=new Array(N).fill(-1), fixed=new Array(N).fill(false);
  slots.forEach((s,i)=>{const v=state.slots[s.key];if(v&&v.locked&&idx.has(v.m)){A[i]=idx.get(v.m);fixed[i]=true;}});
  const pv=slotMgr(addDays(start,-1),"night"), nx=slotMgr(addDays(start,nD),"day");
  const prevNight=pv?idx.get(pv):-2, nextDay=nx?idx.get(nx):-2;
  // who can go where: trainees only in training spots, everyone else only in real shifts
  const av=slots.map(s=>M.map((m,mi)=>s.train?(isTrainee[mi]&&avail(m,s.date,"night")):(!isTrainee[mi]&&avail(m,s.date,s.shift))));
  const avList=av.map(row=>row.map((ok,mi)=>ok?mi:-1).filter(mi=>mi>=0));
  const nightIdx=slots.map(s=>{const j=slotAt[s.di].night;return j===undefined?-1:j;});
  const trainersAt=slots.map((s,i)=>s.shift==="night"?avList[i].filter(mi=>isTrainer[mi]):[]);
  const free=[],freeReg=[],freeTrn=[],fixedTrn=[];
  slots.forEach((s,i)=>{if(fixed[i]){if(s.train)fixedTrn.push(i);return;}free.push(i);(s.train?freeTrn:freeReg).push(i);});
  const weekSlots=Array.from({length:W},()=>[]);slots.forEach((s,i)=>weekSlots[s.week].push(i));
  const trainPossible=slots.map((s,i)=>{if(!s.train)return false;const j=nightIdx[i];if(j<0)return false;return fixed[j]?isTrainer[A[j]]:trainersAt[j].length>0;});
  const possible=M.map((m,mi)=>Array.from({length:W},(_,w)=>weekSlots[w].some(i=>av[i][mi]&&(!slots[i].train||trainPossible[i]))));
  const isContract=M.map(m=>m.type==="contract"), mins=M.map(m=>m.type==="contract"?(m.min||0):0), maxs=M.map(m=>m.max==null?Infinity:m.max);

  // hard rules: availability, one shift a day, no back to backs, weekly max, trainees only with a trainer
  function valid(i){
    const mi=A[i];if(mi<0)return true;
    const s=slots[i], day=slotAt[s.di];
    if(!fixed[i]&&!av[i][mi])return false;
    for(const k in day){const j=day[k];if(j!==i&&A[j]===mi)return false;}
    if(s.shift==="day"){let pn=prevNight;if(s.di>0){const j=slotAt[s.di-1].night;pn=j===undefined?-1:A[j];}if(pn===mi)return false;}
    else if(s.shift==="night"){
      let nd=nextDay;if(s.di<nD-1){const j=slotAt[s.di+1].day;nd=j===undefined?-1:A[j];}if(nd===mi)return false;
      const t=day.trainee;if(t!==undefined&&!fixed[t]&&A[t]>=0&&!isTrainer[mi])return false;
    }
    else if(s.train&&!fixed[i]){const j=nightIdx[i];const nm=j<0?-1:A[j];if(nm<0||!isTrainer[nm])return false;}
    if(maxs[mi]!==Infinity){let c=0;for(const j of weekSlots[s.week])if(A[j]===mi)c++;if(c>maxs[mi])return false;}
    return true;
  }
  // preferences, as penalty points, in priority order: empty shifts, contract minimums, a shift for every casual,
  // trainees' training shifts, an even split between casuals, then an even spread overall
  const counts=new Int32Array(nM*W), totals=new Int32Array(nM);
  // even split between casuals: each week, share the casuals' shifts evenly, but never beyond what each casual can work that week
  const casualIdx=M.map((m,i)=>i).filter(i=>M[i].type==="casual"&&!isTrainee[i]);
  const capW=casualIdx.map(mi=>Array.from({length:W},(_,w)=>{let n=0;for(let di=w*7;di<w*7+7;di++){for(const k in slotAt[di])if(av[slotAt[di][k]][mi]){n++;break;}}return Math.min(n,maxs[mi]);}));
  const capOrder=Array.from({length:W},(_,w)=>casualIdx.map((_,k)=>k).sort((a,b)=>capW[a][w]-capW[b][w]));
  const share=new Float64Array(casualIdx.length);
  function unevenCasuals(){
    let p=0;
    for(let w=0;w<W;w++){
      let left=0;for(const mi of casualIdx)left+=counts[mi*W+w];
      let n=casualIdx.length;
      for(const k of capOrder[w]){const even=left/n, s=capW[k][w]<even?capW[k][w]:even;share[k]=s;left-=s;n--;}
      for(let k=0;k<casualIdx.length;k++){const d=counts[casualIdx[k]*W+w]-share[k];p+=d*d;}
    }
    return p;
  }
  function penalty(){
    counts.fill(0);totals.fill(0);let p=0;
    for(let i=0;i<N;i++){const mi=A[i];if(mi<0){if(!slots[i].train)p+=10000;continue;}counts[mi*W+slots[i].week]++;totals[mi]++;}
    for(const t of fixedTrn){const j=nightIdx[t];const nm=j<0?-1:A[j];if(nm<0||!isTrainer[nm])p+=3000;}
    for(let mi=0;mi<nM;mi++){
      for(let w=0;w<W;w++){const c=counts[mi*W+w];
        if(isContract[mi]){if(c<mins[mi])p+=(isTrainee[mi]?300:600)*(mins[mi]-c);}
        else if(c===0&&possible[mi][w])p+=isTrainee[mi]?150:400;
        p+=c*c*2;
      }
      p+=totals[mi]*totals[mi]*3;
    }
    if(casualIdx.length>1)p+=40*unevenCasuals();
    return p;
  }
  const pick=arr=>arr[(Math.random()*arr.length)|0];
  const ITER=Math.max(3500,200*N);
  const t0=performance.now(); let best=A.slice(),bestP=Infinity,restarts=0;
  while(restarts<60&&(restarts<4||performance.now()-t0<1500)){
    restarts++;
    for(const i of free)A[i]=-1;
    // first draft: hardest shifts first, then training spots
    const order=freeReg.slice().sort((a,b)=>(avList[a].length+Math.random()*1.5)-(avList[b].length+Math.random()*1.5));
    for(const i of order){
      let bm=-1,bp=Infinity;
      for(const mi of avList[i]){A[i]=mi;if(!valid(i))continue;const p=penalty()+Math.random()*40;if(p<bp){bp=p;bm=mi;}}
      A[i]=bm;
    }
    for(const i of freeTrn.slice().sort(()=>Math.random()-.5)){
      A[i]=-1;let bm=-1,bp=penalty()+Math.random()*40;
      for(const mi of avList[i]){A[i]=mi;if(!valid(i))continue;const p=penalty()+Math.random()*40;if(p<bp){bp=p;bm=mi;}}
      A[i]=bm;
    }
    // improve: small changes, sometimes accepting a slightly worse roster early on to escape dead ends
    let cur=penalty(), localBest=cur, localA=A.slice();
    for(let it=0;it<ITER&&free.length;it++){
      const T=40*Math.pow(0.01,it/ITER), r=Math.random();
      if(freeTrn.length&&r<0.25){
        // move a trainee, putting a trainer on that night if needed
        const i=pick(freeTrn), L=avList[i], ch=(!L.length||Math.random()<0.25)?-1:pick(L);
        if(ch===A[i])continue;
        const j=nightIdx[i], oldT=A[i], oldN=j<0?-1:A[j];
        A[i]=ch;let ok=true;
        if(ch>=0){
          if(j<0)ok=false;
          else if(oldN<0||!isTrainer[oldN]){
            if(fixed[j]||!trainersAt[j].length)ok=false;
            else{A[j]=pick(trainersAt[j]);if(!valid(j))ok=false;}
          }
          if(ok&&!valid(i))ok=false;
        }
        let keep=false;
        if(ok){const p=penalty();if(p<=cur||Math.random()<Math.exp((cur-p)/T)){cur=p;keep=true;}}
        if(!keep){A[i]=oldT;if(j>=0)A[j]=oldN;}
      }else if(r<0.65){
        if(!freeReg.length)continue;
        const i=pick(freeReg), L=avList[i];if(!L.length)continue;
        const mi=pick(L);if(mi===A[i])continue;
        const old=A[i];A[i]=mi;let keep=false;
        if(valid(i)){const p=penalty();if(p<=cur||Math.random()<Math.exp((cur-p)/T)){cur=p;keep=true;}}
        if(!keep)A[i]=old;
      }else{
        if(freeReg.length<2)continue;
        const i=pick(freeReg), j=pick(freeReg);if(i===j||A[i]===A[j])continue;
        const a=A[i],b=A[j];A[i]=b;A[j]=a;let keep=false;
        if(valid(i)&&valid(j)){const p=penalty();if(p<=cur||Math.random()<Math.exp((cur-p)/T)){cur=p;keep=true;}}
        if(!keep){A[i]=a;A[j]=b;}
      }
      if(cur<localBest){localBest=cur;localA=A.slice();}
    }
    if(localBest<bestP){bestP=localBest;best=localA;}
  }
  const result={};
  slots.forEach((s,i)=>{if(!fixed[i])result[s.key]=best[i]>=0?M[best[i]].id:null;});
  return {result,unfilled:freeReg.filter(i=>best[i]<0).length};
}

/* ---------- checks shown under the roster ---------- */
function analyze(start){
  const W=state.weeks, dates=windowDates(start), issues=[], M=state.managers;
  const cnt=new Map(M.map(m=>[m.id,new Array(W).fill(0)]));
  let filled=0,total=0,training=0;
  if(M.some(m=>m.trainee)&&!M.some(m=>!m.trainee&&m.canTrain))
    issues.push({lvl:"warn",t:"No managers are marked as trainers, so trainees can't be given training shifts. Tick “Can train trainees” for your trainers on the Managers tab."});
  dates.forEach((d,di)=>{
    const w=(di/7)|0, seen={}, sh=shiftsFor(d), when=`${DAYS[dow(d)]} ${fmt(d)}`;
    for(const s of sh){
      total++;const key=d+":"+s, id=slotMgr(d,s);
      if(!id){issues.push({lvl:"bad",key,t:`${when} ${SHIFT_NAME[s]} shift has no manager.`});continue;}
      filled++;cnt.get(id)[w]++;const m=mById(id);
      if(m.trainee)issues.push({lvl:"bad",key,t:`${m.name} is a trainee and can't run the ${SHIFT_NAME[s]} shift on ${when} on their own.`});
      else if(!avail(m,d,s))issues.push({lvl:"bad",key,t:`${m.name} isn't available for ${SHIFT_NAME[s]} on ${when}.`});
      if(seen[id])issues.push({lvl:"bad",key,t:`${m.name} has two shifts on ${when}.`});
      seen[id]=true;
    }
    const tid=slotMgr(d,"trainee");
    if(tid){
      const key=d+":trainee", m=mById(tid), nid=slotMgr(d,"night"), n=nid?mById(nid):null;
      cnt.get(tid)[w]++;training++;
      if(!m.trainee)issues.push({lvl:"warn",key,t:`${m.name} is in the training spot on ${when} but isn't marked as a trainee.`});
      else if(!avail(m,d,"night"))issues.push({lvl:"bad",key,t:`${m.name} isn't available for a training night on ${when}.`});
      if(!n)issues.push({lvl:"bad",key,t:`${m.name} is training on ${when}, but nobody is on the night shift with them.`});
      else if(n.trainee||!n.canTrain)issues.push({lvl:"bad",key,t:`${m.name} is training with ${n.name} on ${when}, but ${n.name} isn't marked as a trainer.`});
      if(seen[tid])issues.push({lvl:"bad",key,t:`${m.name} has two shifts on ${when}.`});
      seen[tid]=true;
    }
    const n=slotMgr(d,"night"), nd=slotMgr(addDays(d,1),"day");
    if(n&&n===nd)issues.push({lvl:"bad",key:addDays(d,1)+":day",t:`Back to back: ${mById(n).name} works night on ${when} then day on ${fmt(addDays(d,1))}.`});
  });
  const pn=slotMgr(addDays(start,-1),"night"), fd=slotMgr(start,"day");
  if(pn&&pn===fd)issues.push({lvl:"bad",key:start+":day",t:`Back to back: ${mById(pn).name} works night on ${fmt(addDays(start,-1))} (previous roster) then day on ${fmt(start)}.`});
  M.forEach(m=>{
    const c=cnt.get(m.id), what=m.trainee?"training shift":"shift";
    c.forEach((v,w)=>{
      const wDates=dates.slice(w*7,w*7+7);
      if(m.type==="contract"&&v<m.min)issues.push({lvl:"warn",t:`${m.name} has ${v} of their ${m.min} minimum ${what}s in week ${w+1}.`});
      if(m.type==="casual"&&v===0){
        const possible=wDates.some(d=>isAvailAny(m,d));
        issues.push({lvl:"warn",t:`${m.name} (casual${m.trainee?" trainee":""}) has no ${what} in week ${w+1}${possible?".":" — not available that week."}`});
      }
      if(m.max!=null&&v>m.max)issues.push({lvl:"bad",t:`${m.name} has ${v} ${what}s in week ${w+1}, over their maximum of ${m.max}.`});
    });
  });
  // explain any week where one casual has 3 or more shifts more than another
  const casuals=M.filter(m=>m.type==="casual"&&!m.trainee);
  if(casuals.length>1)for(let w=0;w<W;w++){
    const byCount=casuals.slice().sort((a,b)=>cnt.get(b.id)[w]-cnt.get(a.id)[w]);
    const hi=byCount[0], lo=byCount[byCount.length-1], ch=cnt.get(hi.id)[w], cl=cnt.get(lo.id)[w];
    if(ch-cl<3)continue;
    const r={unavailable:0,trainer:0,busy:0,b2b:0,max:0,free:0}, atMax=lo.max!=null&&cl>=lo.max;
    for(const d of dates.slice(w*7,w*7+7))for(const s of shiftsFor(d)){
      if(slotMgr(d,s)!==hi.id)continue;
      if(!avail(lo,d,s))r.unavailable++;
      else if(SHIFTS.some(x=>slotMgr(d,x)===lo.id)||slotMgr(d,"trainee")===lo.id)r.busy++;
      else if((s==="day"&&slotMgr(addDays(d,-1),"night")===lo.id)||(s==="night"&&slotMgr(addDays(d,1),"day")===lo.id))r.b2b++;
      else if(s==="night"&&slotMgr(d,"trainee")&&!lo.canTrain)r.trainer++;
      else if(atMax)r.max++;
      else r.free++;
    }
    const parts=[];
    if(r.unavailable)parts.push(`${lo.name} isn't available for ${r.unavailable}`);
    if(r.trainer)parts.push(`${r.trainer} ${r.trainer>1?"are training nights that need":"is a training night that needs"} a trainer`);
    if(r.busy)parts.push(`${r.busy} ${r.busy>1?"fall on days":"falls on a day"} ${lo.name} already works`);
    if(r.b2b)parts.push(`${r.b2b} would give ${lo.name} a back to back`);
    if(r.max)parts.push(`${r.max} would take ${lo.name} past their weekly max`);
    if(r.free)parts.push(`${r.free} could go to ${lo.name}`);
    const list=parts.length>1?parts.slice(0,-1).join(", ")+" and "+parts[parts.length-1]:(parts[0]||"");
    const tip=r.trainer?` If ${lo.name} can train, ticking “Can train trainees” lets them share those nights.`:"";
    issues.push({lvl:"info",t:`Week ${w+1}: ${hi.name} has ${ch} shifts and ${lo.name} has ${cl}.${list?` Of ${hi.name}'s shifts, ${list}.`:""}${tip}`});
  }
  return {issues,cnt,filled,total,training};
}

/* ---------- rendering ---------- */
const app=document.getElementById("app");
const svgPin=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 4 4H6l4-4z" fill="currentColor"/><path d="M12 14v7"/></svg>`;

function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===state.tab)));
  document.getElementById("plabel").textContent=periodText();
  document.getElementById("pstart").value=state.start;
  document.getElementById("pweeks").value=String(state.weeks);
  app.innerHTML=state.tab==="team"?renderTeam():state.tab==="sheet"?renderSheet():renderRoster();
  if(state.tab==="team"){const n=document.getElementById("m-name");if(n&&ui.focusName){n.focus();n.select();ui.focusName=false;}}
  if(ui.focusDay){ui.focusDay=false;const p=document.getElementById("dayedit");if(p){p.scrollIntoView({block:"nearest"});const inp=document.getElementById("dl-label");if(inp)inp.focus({preventScroll:true});}}
}

function exampleBanner(){
  if(!state.example||!state.managers.some(m=>m.example))return "";
  return `<div class="banner"><span><b>Example team.</b> These managers are made up so you can try the generator. Remove them and add your own.</span>
  ${ui.confirm==="examples"?`<span class="confirm">Remove examples and their shifts? <button class="btn danger solid" data-act="examples-yes">Remove</button><button class="btn" data-act="cancel">Keep</button></span>`:`<button class="btn" data-act="examples">Remove example team</button>`}</div>`;
}
const pills=m=>`<span class="pill ${m.type}">${m.type}</span>${m.trainee?` <span class="pill trainee">trainee</span>`:m.canTrain?` <span class="pill trainer">trainer</span>`:""}`;

function slotSelect(key,label,cur,groups){
  return `<select data-slot="${key}" aria-label="${esc(label)}"><option value="">—</option>${groups.filter(g=>g[1].length).map(([gl,list])=>`<optgroup label="${esc(gl)}">${list.map(m=>`<option value="${m.id}" ${m.id===cur?"selected":""}>${esc(m.name)}</option>`).join("")}</optgroup>`).join("")}</select>`;
}
const pinBtn=(key,locked,cur)=>`<button class="pin" data-pin="${key}" aria-pressed="${locked}" aria-label="${locked?"Unpin":"Pin"} this shift" title="${locked?"Pinned: kept when you generate":"Pin to keep when you generate"}" ${cur?"":"disabled"}>${svgPin}</button>`;

function dayCard(d,regular,trainees,flagged){
  const sh=shiftsFor(d), info=state.days[d], when=`${DAYS[dow(d)]} ${fmt(d)}`;
  let h=`<div class="dcard ${sh.includes("mid")?"fri":""} ${info?"special":""} ${sh.length?"":"closed"}">
    <button class="dhead" data-day="${d}" title="Add a label or change this day's shifts" aria-label="${DAYS_FULL[dow(d)]} ${fmt(d)}${info&&info.label?`, ${esc(info.label)}`:""}. Add a label or change shifts"><b>${DAYS[dow(d)]}</b><span>${fmt(d)}</span></button>`;
  if(info&&info.label)h+=`<div class="dlabel">${esc(info.label)}</div>`;
  if(!sh.length)h+=`<div class="closednote">Closed</div>`;
  for(const s of sh){
    const key=d+":"+s, v=state.slots[key], cur=v&&mById(v.m)?v.m:"", locked=!!(v&&v.locked&&cur), curM=cur?mById(cur):null;
    const groups=[["Available",regular.filter(m=>avail(m,d,s))],["Not available",regular.filter(m=>!avail(m,d,s))]];
    if(curM&&curM.trainee)groups.push(["Trainee (can't run a shift)",[curM]]);
    h+=`<div class="slot ${s} ${cur?"":"empty"} ${flagged.has(key)&&cur?"flag":""} ${locked?"pinned":""}"><span class="tag">${SHIFT_NAME[s]}</span>${slotSelect(key,`${when} ${SHIFT_NAME[s]}`,cur,groups)}${pinBtn(key,locked,cur)}</div>`;
  }
  const tv=state.slots[d+":trainee"];
  if(sh.includes("night")&&(trainees.length||(tv&&mById(tv.m)))){
    const key=d+":trainee", cur=tv&&mById(tv.m)?tv.m:"", locked=!!(tv&&tv.locked&&cur), curM=cur?mById(cur):null;
    const groups=[["Available",trainees.filter(m=>avail(m,d,"night"))],["Not available",trainees.filter(m=>!avail(m,d,"night"))]];
    if(curM&&!curM.trainee)groups.push(["Not a trainee",[curM]]);
    h+=`<div class="slot trainee ${cur?"":"empty"} ${flagged.has(key)&&cur?"flag":""} ${locked?"pinned":""}"><span class="tag" title="Training shift: a trainee working with the night manager">Trn</span>${slotSelect(key,`${when} training shift`,cur,groups)}${pinBtn(key,locked,cur)}</div>`;
  }
  return h+`</div>`;
}

const SHEET_TXT={day:"D",mid:"MID",night:"N"};
const EX={ink:"#18212E",head:"#1F4F8F",headFg:"#FFFFFF",dayHead:"#DCE7F6",dayHeadFg:"#1F4F8F",line:"#C9D2DE",zebra:"#F7F9FB",
  day:["#FCEBCB","#8A5300"],mid:["#CFEFE9","#0F6B61"],night:["#E2E0F7","#3D3794"],train:["#F9E0EC","#9C2463"],
  off:["#EEF0F3","#9AA3AF"],closed:["#DFE3E9","#6B7480"],note:["#E6F2DC","#33600F"]};
const ddmm=s=>{const d=toD(s);return `${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")}`;};
function sheetModel(){
  const dates=windowDates(state.start), M=state.managers;
  return Array.from({length:state.weeks},(_,w)=>{
    const days=dates.slice(w*7,w*7+7), notes=days.map(dayNote);
    return {label:`Week ${w+1}`,days:days.map(d=>`${DAYS_FULL[dow(d)]} (${ddmm(d)})`),notes,hasNotes:notes.some(Boolean),
      rows:M.map(m=>({name:m.name,cells:days.map(d=>{
        const sh=shiftsFor(d);
        for(const s of sh)if(slotMgr(d,s)===m.id)return{t:SHEET_TXT[s],k:s};
        if(slotMgr(d,"trainee")===m.id)return{t:"TRAINING",k:"train"};
        if(!sh.length)return{t:"",k:"closed"};
        if(ui.shadeOff&&!isAvailAny(m,d))return{t:"",k:"off"};
        return{t:"",k:""};})}))};
  });
}

function sheetHTML(){ // inline-styled copy for pasting into Excel / email
  const W=sheetModel(), b=`border:1px solid ${EX.line};`, cell="padding:4px 10px;font-family:Calibri,Arial,sans-serif;font-size:11pt;";

function sheetText(){
  return sheetModel().map((w,i)=>{
    const lines=[(i?"\n":"")+[w.label,...w.days].join("\t")];
    if(w.hasNotes)lines.push(["",...w.notes].join("\t"));
    w.rows.forEach(r=>lines.push([r.name,...r.cells.map(c=>c.t)].join("\t")));
    return lines.join("\n");
  }).join("\n");
}
const FONT="Barlow, Arial, sans-serif";
// Fit text in a cell: at each size try one line, then (where allowed) two lines, before going smaller; last resort an ellipsis.
function splitTwo(g,words,maxW){
  let a="",k=0;
  for(;k<words.length;k++){const n=a?a+" "+words[k]:words[k];if(g.measureText(n).width>maxW)break;a=n;}
  return [a,words.slice(k).join(" ")];
}
function fitText(g,text,maxW,weight,size,min,maxLines){
  const words=text.split(" ");
  for(let s=size;s>=min;s-=0.5){
    g.font=`${weight} ${s}px ${FONT}`;
    if(g.measureText(text).width<=maxW)return{lines:[text],size:s};
    if(maxLines>1&&words.length>1){const [a,b]=splitTwo(g,words,maxW);if(a&&b&&g.measureText(b).width<=maxW)return{lines:[a,b],size:s};}
  }
  g.font=`${weight} ${min}px ${FONT}`;
  const cut=t=>{while(t.length>1&&g.measureText(t+"…").width>maxW)t=t.slice(0,-1);return t+"…";};
  if(maxLines>1&&words.length>1){const [a,b]=splitTwo(g,words,maxW);if(a&&b)return{lines:[a,cut(b)],size:min};}
  return{lines:[cut(text)],size:min};
}
function sheetCanvas(){
  const W=sheetModel(), S=2, nameW=150, colW=132, rowH=28, noteH=38, gap=14, pad=20, titleH=44;
  let height=pad*2+titleH+gap*(W.length-1);
  W.forEach(w=>{height+=rowH*(1+w.rows.length)+(w.hasNotes?noteH:0);});
  const width=pad*2+nameW+colW*7;
  const cv=document.createElement("canvas");cv.width=width*S;cv.height=height*S;
  const g=cv.getContext("2d");g.scale(S,S);g.textBaseline="middle";
  g.fillStyle="#FFFFFF";g.fillRect(0,0,width,height);
  g.fillStyle=EX.ink;g.font=`600 20px ${FONT}`;g.textAlign="left";
  g.fillText(`Manager roster · ${periodText()}`,pad,pad+14);
  let y=pad+titleH;
  const box=(x,w,h,fill,text,fg,weight,size,align,maxLines=1)=>{
    g.fillStyle=fill;g.fillRect(x,y,w,h);g.strokeStyle=EX.line;g.lineWidth=1;g.strokeRect(x+.5,y+.5,w,h);
    if(!text)return;
    const f=fitText(g,text,w-12,weight,size,maxLines>1?10.5:10,maxLines), lh=f.size*1.2, y0=y+h/2-(f.lines.length-1)*lh/2+1;
    g.fillStyle=fg;g.textAlign=align;
    f.lines.forEach((ln,k)=>g.fillText(ln,align==="center"?x+w/2:x+8,y0+k*lh));
    g.textAlign="left";
  };
  W.forEach((wk,i)=>{
    if(i)y+=gap;
    box(pad,nameW,rowH,EX.head,wk.label,EX.headFg,700,14,"left");
    wk.days.forEach((d,j)=>box(pad+nameW+j*colW,colW,rowH,EX.dayHead,d,EX.dayHeadFg,600,12.5,"center"));
    y+=rowH;
    if(wk.hasNotes){
      box(pad,nameW,noteH,"#FFFFFF","",EX.ink,600,12,"left");
      wk.notes.forEach((n,j)=>box(pad+nameW+j*colW,colW,noteH,n?EX.note[0]:"#FFFFFF",n,EX.note[1],600,12.5,"center",2));
      y+=noteH;
    }
    wk.rows.forEach((r,ri)=>{
      const z=ri%2?EX.zebra:"#FFFFFF";
      box(pad,nameW,rowH,z,r.name,EX.ink,600,13.5,"left");
      r.cells.forEach((c,j)=>{const p=EX[c.k];box(pad+nameW+j*colW,colW,rowH,p?p[0]:z,c.t,p?p[1]:EX.ink,700,c.k==="train"?12:13.5,"center");});
      y+=rowH;
    });
  });
  return cv;
}
let excelLib=null;
function loadExcel(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  if(excelLib)return excelLib;
  excelLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";s.onload=()=>res(window.ExcelJS);s.onerror=()=>{excelLib=null;rej();};document.head.appendChild(s);});
  return excelLib;
}
async function buildXlsx(){
  const ExcelJS=await loadExcel(), wb=new ExcelJS.Workbook(), ws=wb.addWorksheet("Roster",{views:[{showGridLines:false}]});
  const argb=h=>"FF"+h.slice(1).toUpperCase(), fill=h=>({type:"pattern",pattern:"solid",fgColor:{argb:argb(h)}});
  const line={style:"thin",color:{argb:argb(EX.line)}}, border={top:line,left:line,bottom:line,right:line};
  ws.columns=[{width:18},...Array.from({length:7},()=>({width:20}))];
  const t=ws.addRow([`Manager roster · ${periodText()}`]);t.font={bold:true,size:14};t.height=24;
  ws.addRow([]);
  sheetModel().forEach((wk,i)=>{
    if(i)ws.addRow([]).height=8;
    const h=ws.addRow([wk.label,...wk.days]);h.height=20;
    for(let n=1;n<=8;n++){const c=h.getCell(n);c.border=border;c.font={bold:true,color:{argb:argb(n===1?EX.headFg:EX.dayHeadFg)}};c.fill=fill(n===1?EX.head:EX.dayHead);c.alignment={vertical:"middle",horizontal:n===1?"left":"center"};}
    if(wk.hasNotes){
      const nr=ws.addRow(["",...wk.notes]);nr.height=wk.notes.some(n=>n.length>20)?32:18;
      for(let n=1;n<=8;n++){const c=nr.getCell(n);c.border=border;c.alignment={vertical:"middle",horizontal:"center",wrapText:true};
        if(n>1&&wk.notes[n-2]){c.fill=fill(EX.note[0]);c.font={bold:true,color:{argb:argb(EX.note[1])}};}}
    }
    wk.rows.forEach(r=>{
      const row=ws.addRow([r.name,...r.cells.map(c=>c.t)]);row.height=18;
      for(let n=1;n<=8;n++){const c=row.getCell(n);c.border=border;c.alignment={vertical:"middle",horizontal:n===1?"left":"center"};c.font={bold:true};
        if(n>1){const p=EX[r.cells[n-2].k];if(p){c.fill=fill(p[0]);c.font={bold:true,color:{argb:argb(p[1])}};}}}
    });
  });
  return await wb.xlsx.writeBuffer();
}

/* ---------- actions ---------- */
let toastT=null;
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400);}
function commit(){save();render();}
const windowKeys=()=>windowDates(state.start).flatMap(slotKeys);
// keep the exception form's dates when the form redraws
function syncExForm(){const g=id=>document.getElementById(id)?.value;const d=g("ex-date"),f=g("ex-from"),t=g("ex-to");if(d!==undefined)ui.exDate=d;if(f!==undefined)ui.exFrom=f;if(t!==undefined)ui.exTo=t;}
function updateExRange(){
  const f=document.getElementById("ex-from"),t=document.getElementById("ex-to"),l=document.getElementById("ex-len");
  if(f)f.value=ui.exFrom||"";if(t){t.value=ui.exTo||"";t.min=ui.exFrom||"";}if(l)l.textContent=exLenText();
}
function goTo(start,weeks){state.start=start;state.weeks=weeks||state.periods[start]||state.weeks;ui.status=null;ui.confirm=null;ui.dayDraft=null;commit();}
function openDay(d){
  const o=state.days[d], mode=!o||!o.shifts?"normal":SHIFTS.some(s=>o.shifts[s])?"custom":"closed";
  const shifts=mode==="custom"?{...o.shifts}:Object.fromEntries(SHIFTS.map(s=>[s,defaultShifts(d).includes(s)]));
  ui.dayDraft={date:d,label:o?o.label:"",mode,shifts};ui.focusDay=true;render();
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;ui.confirm=null;commit();return;}
  if(t.id==="next"){goTo(addDays(state.start,state.weeks*7));return;}
  if(t.id==="prev"){
    let ps=null;for(const k in state.periods)if(k<state.start&&addDays(k,state.periods[k]*7)===state.start)ps=k;
    if(ps)goTo(ps,state.periods[ps]);else goTo(addDays(state.start,-state.weeks*7),state.weeks);
    return;}
  if(t.dataset.pin){const v=state.slots[t.dataset.pin];if(v&&v.m){v.locked=!v.locked;commit();}return;}
  if(t.dataset.sel){ui.sel=t.dataset.sel;ui.confirm=null;render();return;}
  if(t.dataset.type){const m=mById(ui.sel);m.type=t.dataset.type;if(m.type==="contract"&&!m.min)m.min=3;commit();return;}
  if(t.dataset.role){const m=mById(ui.sel);m.trainee=t.dataset.role==="trainee";commit();return;}
  if(t.dataset.week){const m=mById(ui.sel),k=t.dataset.week;
    if(k==="tn-all"||k==="tn-none")m.week.forEach(w=>{w.night=k==="tn-all";});
    else m.week.forEach((w,i)=>{w.day=k==="all"||k==="days";w.night=k==="all"||k==="nights";w.mid=i===4&&(k==="all"||k==="days");});
    commit();return;}
  if(t.dataset.delex){const m=mById(ui.sel);m.exceptions=m.exceptions.filter(x=>x.id!==t.dataset.delex);commit();return;}
  if(t.dataset.exmode){syncExForm();ui.exMode=t.dataset.exmode;render();return;}
  if(t.dataset.exweeks){syncExForm();if(!isDate(ui.exFrom))ui.exFrom=state.start;ui.exTo=addDays(ui.exFrom,+t.dataset.exweeks*7-1);updateExRange();return;}
  if(t.dataset.day){openDay(t.dataset.day);return;}
  if(t.dataset.dmode&&ui.dayDraft){const dd=ui.dayDraft;dd.mode=t.dataset.dmode;
    if(dd.mode==="custom"&&!SHIFTS.some(s=>dd.shifts[s]))dd.shifts=Object.fromEntries(SHIFTS.map(s=>[s,defaultShifts(dd.date).includes(s)]));
    render();return;}
  if(t.dataset.chip!==undefined&&ui.dayDraft){ui.dayDraft.label=t.dataset.chip;ui.focusDay=true;render();return;}
  const act=t.dataset.act;if(!act)return;
  switch(act){
    case "cancel":ui.confirm=null;render();break;
    case "goto-team":state.tab="team";commit();break;
    case "goto-sheet":state.tab="sheet";commit();break;
    case "examples":case "clear-gen":case "clear-all":case "del-mgr":ui.confirm=act;render();break;
    case "examples-yes":{const ids=new Set(state.managers.filter(m=>m.example).map(m=>m.id));state.managers=state.managers.filter(m=>!m.example);for(const k in state.slots)if(ids.has(state.slots[k].m))delete state.slots[k];state.example=false;ui.confirm=null;commit();toast("Example team removed");break;}
    case "clear-gen-yes":windowKeys().forEach(k=>{const v=state.slots[k];if(v&&!v.locked)delete state.slots[k];});ui.confirm=null;ui.status=null;commit();toast("Generated shifts cleared");break;
    case "clear-all-yes":windowKeys().forEach(k=>delete state.slots[k]);ui.confirm=null;ui.status=null;commit();toast("Roster cleared");break;
    case "add-mgr":{const m=newManager("New manager");state.managers.push(m);ui.sel=m.id;ui.focusName=true;commit();break;}
    case "del-mgr-yes":{const id=ui.sel;state.managers=state.managers.filter(m=>m.id!==id);for(const k in state.slots)if(state.slots[k].m===id)delete state.slots[k];ui.sel=null;ui.confirm=null;commit();toast("Manager deleted");break;}
    case "add-ex":{
      const m=mById(ui.sel);syncExForm();
      let from,to=null;
      if(ui.exMode==="range"){
        from=ui.exFrom;to=ui.exTo;
        if(!isDate(from)||!isDate(to)){toast("Pick a From and To date first");break;}
        if(to<from){toast("The To date is before the From date");break;}
        if(daysBetween(from,to)>366){toast("Pick a stretch of a year or less");break;}
        if(to===from)to=null;
      }else{from=ui.exDate;if(!isDate(from)){toast("Pick a date first");break;}}
      const status=document.getElementById("ex-status").value, chk=id=>!!document.getElementById(id)?.checked;
      const shifts=status==="on"?{day:chk("ex-day"),mid:chk("ex-mid"),night:chk("ex-night")}:{day:false,mid:false,night:false};
      // a new exception replaces any older ones that sit entirely inside its dates
      const end=to||from, before=m.exceptions.length;
      m.exceptions=m.exceptions.filter(x=>!(x.date>=from&&(x.to||x.date)<=end));
      const replaced=before-m.exceptions.length;
      m.exceptions.push({id:uid(),date:from,to,status,shifts});
      commit();
      if(replaced)toast(to?`Added. It replaces ${replaced} earlier exception${replaced>1?"s":""} inside those dates.`:"Added. It replaces the earlier exception for that day.");
      break;}
    case "day-save":{
      const dd=ui.dayDraft;if(!dd)break;
      const label=(document.getElementById("dl-label")?.value??dd.label).trim().slice(0,80);
      const shifts=dd.mode==="normal"?null:dd.mode==="closed"?{day:false,mid:false,night:false}:{...dd.shifts};
      if(!label&&!shifts)delete state.days[dd.date];else state.days[dd.date]={label,shifts};
      pruneDay(dd.date);ui.dayDraft=null;ui.status=null;commit();toast(label?`Saved “${label}”`:"Day saved");break;}
    case "day-remove":{if(!ui.dayDraft)break;delete state.days[ui.dayDraft.date];ui.dayDraft=null;ui.status=null;commit();toast("Label removed");break;}
    case "day-cancel":ui.dayDraft=null;render();break;
    case "generate":{
      if(ui.busy)break;ui.busy=true;ui.status=null;ui.confirm=null;ui.dayDraft=null;render();
      setTimeout(()=>{
        let res;
        try{res=generate(state.start);}catch(err){ui.busy=false;ui.status={cls:"bad",text:"Something went wrong while generating. Your roster wasn't changed."};render();return;}
        for(const k in res.result){if(res.result[k])state.slots[k]={m:res.result[k],locked:false};else delete state.slots[k];}
        ui.busy=false;
        const a=analyze(state.start), tr=state.managers.some(m=>m.trainee)?` ${a.training} training shift${a.training===1?"":"s"} placed.`:"";
        ui.status=res.unfilled?{cls:"bad",text:`Generated, but ${res.unfilled} shift${res.unfilled>1?"s":""} couldn't be filled with the current availability.${tr} See Checks below.`}
          :a.issues.length?{cls:"",text:`Roster generated.${tr} ${a.issues.length} thing${a.issues.length>1?"s":""} to review below.`}
          :{cls:"good",text:`Roster generated: all ${a.total} shifts filled with no back to backs and every minimum met.${tr}`};
        commit();
      },30);break;}
    case "backup":{const d=new Date();await downloads.save({filename:`manager-roster-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`,data:new Blob([JSON.stringify(persistable(),null,2)],{type:"application/json"})});toast("Backup downloaded");break;}
    case "restore":document.getElementById("restore-file").click();break;
    case "restore-yes":{state=normalize(ui.pendingRestore);ui.pendingRestore=null;ui.confirm=null;ui.sel=null;ui.dayDraft=null;commit();toast("Backup restored");break;}
    case "copy-sheet":{
      const html=sheetHTML(), txt=sheetText();
      try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})]);toast("Copied. Paste into Excel, Outlook or Teams");}
      catch(err){try{await navigator.clipboard.writeText(txt);toast("Copied as plain text");}catch(e2){toast("Copy was blocked by this browser");}}
      break;}
    case "xlsx":{
      t.disabled=true;
      try{const buf=await buildXlsx();await downloads.save({filename:`manager-roster-${state.start}.xlsx`,data:buf});}
      catch(err){toast("Couldn't load the Excel builder. Check your internet connection and try again");}
      t.disabled=false;break;}
    case "png":{
      try{const cv=sheetCanvas();const blob=await new Promise(r=>cv.toBlob(r,"image/png"));await downloads.save({filename:`manager-roster-${state.start}.png`,data:blob});}
      catch(err){toast("Download didn't start");}
      break;}
  }
});

document.addEventListener("input",e=>{if(e.target.id==="dl-label"&&ui.dayDraft)ui.dayDraft.label=e.target.value;});
document.addEventListener("keydown",e=>{
  if(e.target.id!=="dl-label")return;
  if(e.key==="Enter"){e.preventDefault();document.querySelector('[data-act="day-save"]')?.click();}
  else if(e.key==="Escape"){ui.dayDraft=null;render();}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.slot){const k=t.dataset.slot;if(t.value)state.slots[k]={m:t.value,locked:true};else delete state.slots[k];ui.status=null;commit();return;}
  if(t.dataset.dsh&&ui.dayDraft){ui.dayDraft.shifts[t.dataset.dsh]=t.checked;return;}
  if(t.id==="restore-file"){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.managers))throw 0;ui.pendingRestore=d;ui.confirm="restore";render();}catch(err){toast("That file isn't a roster backup");}};
    r.readAsText(f);t.value="";return;}
  if(t.id==="shade-off"){ui.shadeOff=t.checked;render();return;}
  if(t.id==="pstart"&&isDate(t.value)){goTo(t.value);return;}
  if(t.id==="pweeks"){state.weeks=clampWeeks(t.value);ui.status=null;ui.confirm=null;ui.dayDraft=null;commit();return;}
  if(t.id==="ex-status"){syncExForm();ui.exStatus=t.value;render();return;}
  if(t.id==="ex-date"){ui.exDate=t.value;return;}
  if(t.id==="ex-from"){ // moving the From date keeps the same length
    const len=isDate(ui.exFrom)&&isDate(ui.exTo)&&ui.exTo>=ui.exFrom?daysBetween(ui.exFrom,ui.exTo):6;
    ui.exFrom=t.value;if(isDate(ui.exFrom))ui.exTo=addDays(ui.exFrom,len);updateExRange();return;}
  if(t.id==="ex-to"){ui.exTo=t.value;updateExRange();return;}
  if(t.dataset.wk!==undefined){const m=mById(ui.sel);m.week[+t.dataset.wk][t.dataset.sh]=t.checked;save();return;}
  const m=mById(ui.sel);if(!m||!t.dataset.f)return;
  if(t.dataset.f==="name"){m.name=t.value.trim()||"Unnamed";commit();}
  if(t.dataset.f==="min"){m.min=Math.max(0,parseInt(t.value,10)||0);commit();}
  if(t.dataset.f==="max"){m.max=t.value===""?null:Math.max(0,parseInt(t.value,10)||0);commit();}
  if(t.dataset.f==="canTrain"){m.canTrain=t.checked;commit();}
});

/* ---------- boot ---------- */
const local=lsGet();
if(local)state=normalize(local);
render();
setSaveState(local?"Saved in this browser":"");
})();
