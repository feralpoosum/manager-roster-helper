<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manager Roster Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a shift board. Sticky toolbar, four week strips of seven day cards, issues + hours summary underneath. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d4dbe5; --fg:#18212e; --muted:#5d6878;
  --accent:#1f4f8f; --accent-fg:#ffffff; --accent-soft:#dce7f6;
  --day:#c97a12; --day-soft:#fbefd9; --mid:#1a8378; --mid-soft:#d8f0ec; --night:#4b44a8; --night-soft:#e3e1f7;
  --bad:#b4322a; --bad-soft:#fbe3e0; --warn:#9a6a00; --warn-soft:#fbf0cf; --ok:#2d7a3e; --ok-soft:#dff1e2;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161e; --surface:#19202b; --surface-2:#222b38; --line:#323d4d; --fg:#e6ebf2; --muted:#9aa6b6;
  --accent:#7fa9e8; --accent-fg:#0d1420; --accent-soft:#1f3150;
  --day:#f0a94a; --day-soft:#3a2c17; --mid:#4cc3b4; --mid-soft:#16352f; --night:#a49ef2; --night-soft:#28264a;
  --bad:#f08a80; --bad-soft:#3d1d1b; --warn:#e8c25a; --warn-soft:#3a3016; --ok:#7bcf8c; --ok-soft:#1b3420;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161e; --surface:#19202b; --surface-2:#222b38; --line:#323d4d; --fg:#e6ebf2; --muted:#9aa6b6;
  --accent:#7fa9e8; --accent-fg:#0d1420; --accent-soft:#1f3150;
  --day:#f0a94a; --day-soft:#3a2c17; --mid:#4cc3b4; --mid-soft:#16352f; --night:#a49ef2; --night-soft:#28264a;
  --bad:#f08a80; --bad-soft:#3d1d1b; --warn:#e8c25a; --warn-soft:#3a3016; --ok:#7bcf8c; --ok-soft:#1b3420;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:24px;font-weight:700}
.brand .sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.period{display:flex;align-items:center;gap:6px}
.period .label{font-family:var(--f-display);font-size:18px;font-weight:600;min-width:0;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.icon{padding:6px 9px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .spacer{flex:1}
.status{font-size:14px;color:var(--muted)}
.status.good{color:var(--ok)} .status.bad{color:var(--bad)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.week{display:flex;flex-direction:column;gap:8px}
.week h2{font-size:18px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.week h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.scroller{overflow-x:auto;padding-bottom:4px}
.days{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;min-width:1080px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dcard.fri{border-color:var(--mid)}
.dhead{display:flex;justify-content:space-between;align-items:baseline}
.dhead b{font-family:var(--f-display);font-size:17px;font-weight:600}
.dhead span{color:var(--muted);font-size:12px}
.slot{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:4px;border-radius:6px;padding:3px 3px 3px 0}
.slot .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 0;text-align:center;border-radius:4px}
.slot.day .tag{background:var(--day-soft);color:var(--day)}
.slot.mid .tag{background:var(--mid-soft);color:var(--mid)}
.slot.night .tag{background:var(--night-soft);color:var(--night)}
.slot select{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 4px;font-size:14px}
.slot.empty select{border-style:dashed;color:var(--muted)}
.slot.flag select{border-color:var(--bad);background:var(--bad-soft)}
.slot.pinned select{border-color:var(--accent);font-weight:600}
.pin{border:0;background:transparent;cursor:pointer;padding:3px;border-radius:4px;color:var(--muted);opacity:.35;line-height:0}
.pin[aria-pressed="true"]{color:var(--accent);opacity:1}
.pin:hover{opacity:1}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}
@media (max-width:860px){.panels{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:19px;font-weight:600}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.issues li{padding:6px 10px;border-radius:6px;background:var(--warn-soft);color:var(--fg);border-left:3px solid var(--warn)}
.issues li.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.issues li.ok{background:var(--ok-soft);border-left-color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
td.short{color:var(--bad);font-weight:700}
td.zero{color:var(--warn);font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.pill.contract{background:var(--accent-soft);color:var(--accent)}
.pill.casual{background:var(--surface-2);color:var(--muted)}
/* Managers */
.mgr-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.mgr-layout{grid-template-columns:minmax(0,1fr)}}
.mlist{display:flex;flex-direction:column;gap:6px}
.mitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.mitem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.mitem .n{font-weight:600}
.mitem .meta{font-size:12px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.field input[type=text],.field input[type=number],.field input[type=date],.field select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px}
.field input[type=number]{width:90px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.avail th,.avail td{padding:5px 8px}
.avail input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.hint{font-size:13px;color:var(--muted);max-width:65ch}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;background:var(--surface-2);font-size:14px}
.exlist .off{color:var(--bad);font-weight:600}
.exlist .on{color:var(--ok);font-weight:600}
.checks{display:flex;gap:12px;align-items:center;padding-bottom:7px}
.checks label{display:inline-flex;gap:5px;align-items:center;font-size:14px}
.empty-state{padding:30px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.busy{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.busy{animation:none}}
.savestate{font-size:12px;color:var(--muted)}
.sheet{border-collapse:separate;border-spacing:0;font-size:14px;min-width:900px;width:100%}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 10px;text-align:center}
.sheet tr.wh th{background:var(--accent-soft);color:var(--accent);font-size:13px;text-transform:none;letter-spacing:0;border-top:1px solid var(--line)}
.sheet tr.wh th.wk{background:var(--accent);color:var(--accent-fg);text-align:left;font-family:var(--f-display);font-size:16px}
.sheet th.nm{text-align:left;font-weight:600;color:var(--fg);text-transform:none;letter-spacing:0;font-size:14px;background:var(--surface)}
.sheet th:first-child,.sheet td:first-child{border-left:1px solid var(--line);position:sticky;left:0;z-index:1}
.sheet td{background:var(--surface);font-weight:700;min-width:110px}
.sheet td.s-day{background:var(--day-soft);color:var(--day)}
.sheet td.s-mid{background:var(--mid-soft);color:var(--mid)}
.sheet td.s-night{background:var(--night-soft);color:var(--night)}
.sheet td.s-off{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.sheet tr.gap td{border:0;background:transparent;height:14px;padding:0}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Manager Roster</h1><span class="savestate" id="savestate"></span></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-roster" data-tab="roster">Roster</button>
    <button role="tab" id="tab-team" data-tab="team">Managers</button>
    <button role="tab" id="tab-sheet" data-tab="sheet">Sheet</button>
  </div>
  <div class="period">
    <button class="btn icon" id="prev" aria-label="Previous 4 weeks">‹</button>
    <span class="label" id="plabel"></span>
    <button class="btn icon" id="next" aria-label="Next 4 weeks">›</button>
    <input type="date" id="pstart" aria-label="Roster start date" style="border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 6px">
  </div>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const SHIFT_NAME={day:"Day",mid:"Mid",night:"Night"};
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LS_KEY="mgr-roster-state-v1";

/* ---------- dates (UTC math, so daylight saving never shifts a day) ---------- */
const toD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d));};
const fromD=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return fromD(d);};
const dow=s=>(toD(s).getUTCDay()+6)%7; // Mon=0
const fmt=s=>{const d=toD(s);return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;};
const fmtY=s=>{const d=toD(s);return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;};
const shiftsFor=s=>dow(s)===4?["day","mid","night"]:["day","night"];
function nextMonday(){const t=new Date();let s=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;while(dow(s)!==0)s=addDays(s,1);return s;}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- state ---------- */
const blankWeek=()=>DAYS.map((_,i)=>({day:true,mid:i===4,night:true}));
function newManager(name){return{id:uid(),name:name||"New manager",type:"casual",min:0,max:null,week:blankWeek(),exceptions:[]};}
let state={version:1,managers:[],slots:{},start:nextMonday(),tab:"roster",example:false};
let ui={shadeOff:true,sel:null,confirm:null,status:null,busy:false,exStatus:"off"};

function normalize(s){
  s=s&&typeof s==="object"?s:{};
  const out={version:1,managers:Array.isArray(s.managers)?s.managers:[],slots:s.slots&&typeof s.slots==="object"?{...s.slots}:{},
    start:typeof s.start==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s.start)?s.start:nextMonday(),tab:["team","sheet"].includes(s.tab)?s.tab:"roster",example:!!s.example};
  out.managers=out.managers.map(m=>({id:m.id||uid(),name:m.name||"Unnamed",type:m.type==="contract"?"contract":"casual",min:Number(m.min)||0,
    max:m.max===null||m.max===undefined||m.max===""?null:Number(m.max),
    week:Array.isArray(m.week)&&m.week.length===7?m.week.map(w=>({day:!!w.day,mid:!!w.mid,night:!!w.night})):blankWeek(),
    exceptions:Array.isArray(m.exceptions)?m.exceptions.map(e=>({id:e.id||uid(),date:e.date,status:e.status==="on"?"on":"off",shifts:{day:!!e.shifts?.day,mid:!!e.shifts?.mid,night:!!e.shifts?.night}})):[],
    example:!!m.example}));
  return out;
}

/* ---------- persistence: artifact db, with browser storage as backup ---------- */
let dbRef=null, writing=false, pending=false, saveTimer=null;
const downloads={save:async({filename,data})=>{
  const blob=data instanceof Blob?data:new Blob([data]);
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:"saved"};}};
function lsGet(){try{const v=localStorage.getItem(LS_KEY);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));}catch(e){}}
function setSaveState(t){document.getElementById("savestate").textContent=t;}
function persistable(){return{version:1,managers:state.managers,slots:state.slots,start:state.start,tab:state.tab,example:state.example};}
function save(){lsSet(persistable());setSaveState("Saved in this browser");}
async function flush(){
  if(writing){pending=true;return;}
  writing=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(persistable())));setSaveState("All changes saved");}
  catch(e){setSaveState(e&&e.code==="quota_exceeded"?"Storage full — clear old rosters":"Couldn't save — kept in this browser");}
  writing=false;
  if(pending){pending=false;flush();}
}

/* ---------- availability ---------- */
const mById=id=>state.managers.find(m=>m.id===id);
function avail(m,date,shift){
  let ex=null;for(const e of m.exceptions)if(e.date===date)ex=e;
  if(ex)return ex.status==="on"?!!ex.shifts[shift]:false;
  return !!m.week[dow(date)][shift];
}
function windowDates(start){return Array.from({length:28},(_,i)=>addDays(start,i));}

/* ---------- generator ---------- */
function generate(start){
  const M=state.managers, nM=M.length, idx=new Map(M.map((m,i)=>[m.id,i]));
  const dates=windowDates(start), slots=[], slotAt=dates.map(()=>({}));
  dates.forEach((d,di)=>shiftsFor(d).forEach(sh=>{slotAt[di][sh]=slots.length;slots.push({key:d+":"+sh,date:d,di,shift:sh,week:(di/7)|0});}));
  const N=slots.length, A=new Array(N).fill(-1), fixed=new Array(N).fill(false);
  slots.forEach((s,i)=>{const v=state.slots[s.key];if(v&&v.locked&&idx.has(v.m)){A[i]=idx.get(v.m);fixed[i]=true;}});
  const pv=state.slots[addDays(start,-1)+":night"], nx=state.slots[addDays(start,28)+":day"];
  const prevNight=pv&&idx.has(pv.m)?idx.get(pv.m):-2, nextDay=nx&&idx.has(nx.m)?idx.get(nx.m):-2;
  const av=slots.map(s=>M.map(m=>avail(m,s.date,s.shift)));
  const avList=slots.map((s,i)=>M.map((_,mi)=>mi).filter(mi=>av[i][mi]));
  const free=slots.map((_,i)=>i).filter(i=>!fixed[i]);
  const weekSlots=[0,1,2,3].map(w=>slots.map((s,i)=>i).filter(i=>slots[i].week===w));
  const casualPossible=M.map((m,mi)=>[0,1,2,3].map(w=>weekSlots[w].some(i=>av[i][mi])));
  const isContract=M.map(m=>m.type==="contract"), mins=M.map(m=>m.type==="contract"?(m.min||0):0), maxs=M.map(m=>m.max==null?Infinity:m.max);

  function valid(i){
    const mi=A[i];if(mi<0)return true;
    const s=slots[i];
    if(!fixed[i]&&!av[i][mi])return false;
    const day=slotAt[s.di];
    for(const sh in day){const j=day[sh];if(j!==i&&A[j]===mi)return false;}
    if(s.shift==="day"){const pn=s.di>0?A[slotAt[s.di-1].night]:prevNight;if(pn===mi)return false;}
    if(s.shift==="night"){const nd=s.di<27?A[slotAt[s.di+1].day]:nextDay;if(nd===mi)return false;}
    if(maxs[mi]!==Infinity){let c=0;for(const j of weekSlots[s.week])if(A[j]===mi)c++;if(c>maxs[mi])return false;}
    return true;
  }
  const counts=new Int32Array(nM*4), totals=new Int32Array(nM);
  function penalty(){
    counts.fill(0);totals.fill(0);let p=0;
    for(let i=0;i<N;i++){const mi=A[i];if(mi<0){p+=10000;continue;}counts[mi*4+slots[i].week]++;totals[mi]++;}
    for(let mi=0;mi<nM;mi++){
      for(let w=0;w<4;w++){const c=counts[mi*4+w];
        if(isContract[mi]){if(c<mins[mi])p+=600*(mins[mi]-c);}
        else if(c===0&&casualPossible[mi][w])p+=250;
        p+=c*c*2; // spread shifts across the weeks
      }
      p+=totals[mi]*totals[mi]*3; // spread shifts across the team
    }
    return p;
  }
  const t0=performance.now(); let best=null,bestP=Infinity,restarts=0;
  while(restarts<60&&(restarts<4||performance.now()-t0<1500)){
    restarts++;
    for(const i of free)A[i]=-1;
    const order=free.slice().sort((a,b)=>(avList[a].length+Math.random()*1.5)-(avList[b].length+Math.random()*1.5));
    for(const i of order){
      let bm=-1,bp=Infinity;
      for(const mi of avList[i]){A[i]=mi;if(!valid(i))continue;const p=penalty()+Math.random()*40;if(p<bp){bp=p;bm=mi;}}
      A[i]=bm;
    }
    let cur=penalty(), localBest=cur, localA=A.slice();
    const ITER=3500;
    for(let it=0;it<ITER&&free.length;it++){
      const T=40*Math.pow(0.01,it/ITER);
      if(Math.random()<0.6){
        const i=free[(Math.random()*free.length)|0], L=avList[i];if(!L.length)continue;
        const mi=L[(Math.random()*L.length)|0];if(mi===A[i])continue;
        const old=A[i];A[i]=mi;if(!valid(i)){A[i]=old;continue;}
        const p=penalty();if(p<=cur||Math.random()<Math.exp((cur-p)/T))cur=p;else A[i]=old;
      }else{
        const i=free[(Math.random()*free.length)|0], j=free[(Math.random()*free.length)|0];
        if(i===j||A[i]===A[j])continue;
        const a=A[i],b=A[j];A[i]=b;A[j]=a;
        if(!valid(i)||!valid(j)){A[i]=a;A[j]=b;continue;}
        const p=penalty();if(p<=cur||Math.random()<Math.exp((cur-p)/T))cur=p;else{A[i]=a;A[j]=b;}
      }
      if(cur<localBest){localBest=cur;localA=A.slice();}
    }
    if(localBest<bestP){bestP=localBest;best=localA;}
  }
  const result={};
  slots.forEach((s,i)=>{if(!fixed[i])result[s.key]=best[i]>=0?M[best[i]].id:null;});
  return {result,unfilled:free.filter(i=>best[i]<0).length};
}

/* ---------- checks shown under the roster ---------- */
function analyze(start){
  const dates=windowDates(start), issues=[], M=state.managers;
  const cnt=new Map(M.map(m=>[m.id,[0,0,0,0]]));
  const get=k=>{const v=state.slots[k];return v&&mById(v.m)?v.m:null;};
  let filled=0,total=0;
  dates.forEach((d,di)=>{
    const w=(di/7)|0, seen={};
    shiftsFor(d).forEach(sh=>{
      total++;const id=get(d+":"+sh);
      if(!id){issues.push({lvl:"bad",key:d+":"+sh,t:`${DAYS[dow(d)]} ${fmt(d)} ${SHIFT_NAME[sh]} shift has no manager.`});return;}
      filled++;cnt.get(id)[w]++;const m=mById(id);
      if(!avail(m,d,sh))issues.push({lvl:"bad",key:d+":"+sh,t:`${m.name} isn't available for ${SHIFT_NAME[sh]} on ${DAYS[dow(d)]} ${fmt(d)}.`});
      if(seen[id])issues.push({lvl:"bad",key:d+":"+sh,t:`${m.name} has two shifts on ${DAYS[dow(d)]} ${fmt(d)}.`});
      seen[id]=true;
    });
    const n=get(d+":night"), nd=get(addDays(d,1)+":day");
    if(n&&n===nd)issues.push({lvl:"bad",key:addDays(d,1)+":day",t:`Back to back: ${mById(n).name} works night on ${DAYS[dow(d)]} ${fmt(d)} then day on ${fmt(addDays(d,1))}.`});
  });
  const pn=get(addDays(start,-1)+":night"), fd=get(start+":day");
  if(pn&&pn===fd)issues.push({lvl:"bad",key:start+":day",t:`Back to back: ${mById(pn).name} works night on ${fmt(addDays(start,-1))} (previous roster) then day on ${fmt(start)}.`});
  M.forEach(m=>{
    const c=cnt.get(m.id);
    c.forEach((v,w)=>{
      const wDates=dates.slice(w*7,w*7+7);
      if(m.type==="contract"&&v<m.min)issues.push({lvl:"warn",t:`${m.name} has ${v} of their ${m.min} minimum shifts in week ${w+1}.`});
      if(m.type==="casual"&&v===0){
        const possible=wDates.some(d=>shiftsFor(d).some(sh=>avail(m,d,sh)));
        issues.push({lvl:"warn",t:possible?`${m.name} (casual) has no shift in week ${w+1}.`:`${m.name} (casual) has no shift in week ${w+1} — not available that week.`});
      }
      if(m.max!=null&&v>m.max)issues.push({lvl:"bad",t:`${m.name} has ${v} shifts in week ${w+1}, over their maximum of ${m.max}.`});
    });
  });
  return {issues,cnt,filled,total};
}

const DAYS_FULL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

const EX={ink:"#18212E",head:"#1F4F8F",headFg:"#FFFFFF",dayHead:"#DCE7F6",dayHeadFg:"#1F4F8F",line:"#C9D2DE",zebra:"#F7F9FB",

function sheetModel(){

function sheetCanvas(){
  const W=sheetModel(), S=2, nameW=150, colW=128, rowH=28, gap=14, pad=20, titleH=44;
  const rowsTotal=W.reduce((n,w)=>n+1+w.rows.length,0);
  const width=pad*2+nameW+colW*7, height=pad*2+titleH+rowsTotal*rowH+gap*3;
  const cv=document.createElement("canvas");cv.width=width*S;cv.height=height*S;
  const g=cv.getContext("2d");g.scale(S,S);
  g.fillStyle="#FFFFFF";g.fillRect(0,0,width,height);
  g.fillStyle=EX.ink;g.font="600 20px Barlow, Arial, sans-serif";g.textBaseline="middle";
  g.fillText(`Manager roster · ${fmt(state.start)} – ${fmtY(addDays(state.start,27))}`,pad,pad+14);
  let y=pad+titleH;
  const box=(x,w,fill,text,fg,font,align)=>{g.fillStyle=fill;g.fillRect(x,y,w,rowH);g.strokeStyle=EX.line;g.lineWidth=1;g.strokeRect(x+.5,y+.5,w,rowH);
    if(text){g.fillStyle=fg;g.font=font;g.textAlign=align;g.fillText(text,align==="center"?x+w/2:x+8,y+rowH/2+1);g.textAlign="left";}};
  W.forEach((wk,i)=>{
    if(i)y+=gap;
    box(pad,nameW,EX.head,wk.label,EX.headFg,"700 14px Barlow, Arial, sans-serif","left");
    wk.days.forEach((d,j)=>box(pad+nameW+j*colW,colW,EX.dayHead,d,EX.dayHeadFg,"600 12.5px Barlow, Arial, sans-serif","center"));
    y+=rowH;
    wk.rows.forEach((r,ri)=>{
      box(pad,nameW,ri%2?EX.zebra:"#FFFFFF",r.name,EX.ink,"600 13.5px Barlow, Arial, sans-serif","left");
      r.cells.forEach((c,j)=>{const p=EX[c.k];box(pad+nameW+j*colW,colW,p?p[0]:(ri%2?EX.zebra:"#FFFFFF"),c.t,p?p[1]:EX.ink,"700 13.5px Barlow, Arial, sans-serif","center");});
      y+=rowH;
    });
  });
  return cv;
}
let excelLib=null;

  const ExcelJS=await loadExcel(), wb=new ExcelJS.Workbook(), ws=wb.addWorksheet("Roster",{views:[{showGridLines:false}]});
  const argb=h=>"FF"+h.slice(1).toUpperCase(), fill=h=>({type:"pattern",pattern:"solid",fgColor:{argb:argb(h)}});
  const border={top:{style:"thin",color:{argb:argb(EX.line)}},left:{style:"thin",color:{argb:argb(EX.line)}},bottom:{style:"thin",color:{argb:argb(EX.line)}},right:{style:"thin",color:{argb:argb(EX.line)}}};
  ws.columns=[{width:18},...Array(7).fill({width:19})];
  const t=ws.addRow([`Manager roster · ${fmt(state.start)} – ${fmtY(addDays(state.start,27))}`]);t.font={bold:true,size:14};t.height=24;
  ws.addRow([]);
  sheetModel().forEach((wk,i)=>{
    if(i)ws.addRow([]).height=8;
    const h=ws.addRow([wk.label,...wk.days]);h.height=20;
    h.eachCell((c,n)=>{c.border=border;c.font={bold:true,color:{argb:argb(n===1?EX.headFg:EX.dayHeadFg)}};c.fill=fill(n===1?EX.head:EX.dayHead);c.alignment={vertical:"middle",horizontal:n===1?"left":"center"};});
    wk.rows.forEach(r=>{
      const row=ws.addRow([r.name,...r.cells.map(c=>c.t)]);row.height=18;
      for(let n=1;n<=8;n++){const c=row.getCell(n);c.border=border;c.alignment={vertical:"middle",horizontal:n===1?"left":"center"};c.font={bold:true};
        if(n>1){const p=EX[r.cells[n-2].k];if(p){c.fill=fill(p[0]);c.font={bold:true,color:{argb:argb(p[1])}};}}}
    });
  });
  return await wb.xlsx.writeBuffer();
}

/* ---------- actions ---------- */
let toastT=null;
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400);}
function commit(){save();render();}
function windowKeys(){return windowDates(state.start).flatMap(d=>shiftsFor(d).map(sh=>d+":"+sh));}

function exampleTeam(){
  const mk=(name,type,min,max,fn)=>{const m={...newManager(name),type,min,max,example:true};fn&&fn(m);return m;};
  const s=state.start;
  return [
    mk("Priya","contract",4,5),
    mk("Tom","contract",3,5,m=>{m.week.forEach(w=>w.night=false);m.week[4].mid=true;}),
    mk("Jess","contract",3,4,m=>{m.week.forEach(w=>w.day=false);m.week[4].mid=false;}),
    mk("Marcus","contract",3,4,m=>{m.week[5]={day:false,mid:false,night:false};m.week[6]={day:false,mid:false,night:false};m.exceptions.push({id:uid(),date:addDays(s,9),status:"off",shifts:{day:false,mid:false,night:false}});}),
    mk("Lena","casual",0,2,m=>{m.week.forEach((w,i)=>{if(i<4){w.day=false;w.night=false;}});}),
    mk("Sam","casual",0,2,m=>{m.week.forEach(w=>w.day=false);m.exceptions.push({id:uid(),date:addDays(s,14),status:"on",shifts:{day:true,mid:false,night:false}});})
  ];
}

function toTable(sep){
  const rows=[["Date","Weekday","Day shift","Mid shift","Night shift"]];
  windowDates(state.start).forEach(d=>{
    const n=sh=>{const v=state.slots[d+":"+sh];const m=v&&mById(v.m);return m?m.name:"";};
    rows.push([d,DAYS[dow(d)],n("day"),dow(d)===4?n("mid"):"",n("night")]);
  });
  return rows.map(r=>r.map(c=>sep===","&&/[",\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c).join(sep)).join("\n");
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;ui.confirm=null;commit();return;}
  if(t.id==="prev"||t.id==="next"){state.start=addDays(state.start,t.id==="prev"?-28:28);ui.status=null;ui.confirm=null;commit();return;}
  if(t.dataset.pin){const v=state.slots[t.dataset.pin];if(v&&v.m){v.locked=!v.locked;commit();}return;}
  if(t.dataset.sel){ui.sel=t.dataset.sel;ui.confirm=null;render();return;}
  if(t.dataset.type){const m=mById(ui.sel);m.type=t.dataset.type;if(m.type==="contract"&&!m.min)m.min=3;commit();return;}
  if(t.dataset.week){const m=mById(ui.sel),k=t.dataset.week;m.week.forEach((w,i)=>{w.day=k==="all"||k==="days";w.night=k==="all"||k==="nights";w.mid=i===4&&(k==="all"||k==="days");});commit();return;}
  if(t.dataset.delex){const m=mById(ui.sel);m.exceptions=m.exceptions.filter(x=>x.id!==t.dataset.delex);commit();return;}
  const act=t.dataset.act;if(!act)return;
  switch(act){
    case "cancel":ui.confirm=null;render();break;
    case "goto-team":state.tab="team";commit();break;
    case "load-examples":state.managers.push(...exampleTeam());state.example=true;state.tab="roster";commit();toast("Example team added");break;
    case "examples":case "clear-gen":case "clear-all":case "del-mgr":ui.confirm=act;render();break;
    case "examples-yes":{const ids=new Set(state.managers.filter(m=>m.example).map(m=>m.id));state.managers=state.managers.filter(m=>!m.example);for(const k in state.slots)if(ids.has(state.slots[k].m))delete state.slots[k];state.example=false;ui.confirm=null;commit();toast("Example team removed");break;}
    case "clear-gen-yes":windowKeys().forEach(k=>{const v=state.slots[k];if(v&&!v.locked)delete state.slots[k];});ui.confirm=null;ui.status=null;commit();toast("Generated shifts cleared");break;
    case "clear-all-yes":windowKeys().forEach(k=>delete state.slots[k]);ui.confirm=null;ui.status=null;commit();toast("Roster cleared");break;
    case "add-mgr":{const m=newManager("New manager");state.managers.push(m);ui.sel=m.id;ui.focusName=true;commit();break;}
    case "del-mgr-yes":{const id=ui.sel;state.managers=state.managers.filter(m=>m.id!==id);for(const k in state.slots)if(state.slots[k].m===id)delete state.slots[k];ui.sel=null;ui.confirm=null;commit();toast("Manager deleted");break;}
    case "add-ex":{
      const m=mById(ui.sel),date=document.getElementById("ex-date").value;if(!date){toast("Pick a date first");break;}
      const status=document.getElementById("ex-status").value;
      const shifts=status==="on"?{day:document.getElementById("ex-day").checked,mid:document.getElementById("ex-mid").checked,night:document.getElementById("ex-night").checked}:{day:false,mid:false,night:false};
      m.exceptions=m.exceptions.filter(x=>x.date!==date);m.exceptions.push({id:uid(),date,status,shifts});ui.exDate=date;commit();break;}
    case "generate":{
      if(ui.busy)break;ui.busy=true;ui.status=null;ui.confirm=null;render();
      setTimeout(()=>{
        const t0=performance.now(),{result,unfilled}=generate(state.start);
        for(const k in result){if(result[k])state.slots[k]={m:result[k],locked:false};else delete state.slots[k];}
        ui.busy=false;
        const a=analyze(state.start);
        ui.status=unfilled?{cls:"bad",text:`Generated, but ${unfilled} shift${unfilled>1?"s":""} couldn't be filled with the current availability. See Checks below.`}
          :a.issues.length?{cls:"",text:`Roster generated. ${a.issues.length} thing${a.issues.length>1?"s":""} to review below.`}
          :{cls:"good",text:`Roster generated: all ${a.total} shifts filled with no back to backs and every minimum met.`};
        commit();
      },30);break;}
    case "backup":{const d=new Date();await downloads.save({filename:`manager-roster-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`,data:new Blob([JSON.stringify(persistable(),null,2)],{type:"application/json"})});toast("Backup downloaded");break;}
    case "restore":document.getElementById("restore-file").click();break;
    case "restore-yes":{state=normalize(ui.pendingRestore);ui.pendingRestore=null;ui.confirm=null;ui.sel=null;commit();toast("Backup restored");break;}
    case "goto-sheet":state.tab="sheet";commit();break;
    case "copy-sheet":{
      const html=sheetHTML(), txt=sheetModel().map((w,i)=>[(i?"\n":"")+[w.label,...w.days].join("\t"),...w.rows.map(r=>[r.name,...r.cells.map(c=>c.t)].join("\t"))].join("\n")).join("\n");
      try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})]);toast("Copied. Paste into Excel, Outlook or Teams");}
      catch(err){try{await navigator.clipboard.writeText(txt);toast("Copied as plain text");}catch(e2){toast("Copy was blocked by this view");}}
      break;}
    case "xlsx":{
      t.disabled=true;
      try{const buf=await buildXlsx();await downloads.save({filename:`manager-roster-${state.start}.xlsx`,data:buf});}
      catch(err){if(!err||err.code!=="declined")toast(err&&err.code?"Download didn't start":"Couldn't load the Excel builder. Try again");}
      t.disabled=false;break;}
    case "png":{
      try{const cv=sheetCanvas();const blob=await new Promise(r=>cv.toBlob(r,"image/png"));await downloads.save({filename:`manager-roster-${state.start}.png`,data:blob});}
      catch(err){if(!err||err.code!=="declined")toast("Download didn't start");}
      break;}
    case "copy":{
      const txt=toTable("\t");
      try{await navigator.clipboard.writeText(txt);toast("Copied. Paste into Excel or Sheets");}
      catch(err){toast("Copy was blocked by this view");}
      break;}
    case "csv":{
      try{await downloads.save({filename:`manager-roster-${state.start}.csv`,data:toTable(",")});}
      catch(err){if(err&&err.code!=="declined")toast("Download didn't start");}
      break;}
  }
});

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.slot){const k=t.dataset.slot;if(t.value)state.slots[k]={m:t.value,locked:true};else delete state.slots[k];ui.status=null;commit();return;}
  if(t.id==="restore-file"){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.managers))throw 0;ui.pendingRestore=d;ui.confirm="restore";render();}catch(err){toast("That file isn't a roster backup");}};
    r.readAsText(f);t.value="";return;}
  if(t.id==="shade-off"){ui.shadeOff=t.checked;render();return;}
  if(t.id==="pstart"&&t.value){state.start=t.value;ui.status=null;commit();return;}
  if(t.id==="ex-status"){ui.exStatus=t.value;ui.exDate=document.getElementById("ex-date").value;render();return;}
  if(t.dataset.wk!==undefined){const m=mById(ui.sel);m.week[+t.dataset.wk][t.dataset.sh]=t.checked;save();return;}
  const m=mById(ui.sel);if(!m||!t.dataset.f)return;
  if(t.dataset.f==="name"){m.name=t.value.trim()||"Unnamed";commit();}
  if(t.dataset.f==="min"){m.min=Math.max(0,parseInt(t.value)||0);commit();}
  if(t.dataset.f==="max"){m.max=t.value===""?null:Math.max(0,parseInt(t.value)||0);commit();}
});

/* ---------- boot ---------- */
const local=lsGet();
if(local)state=normalize(local);
render();
setSaveState(local?"Saved in this browser":"");
})();
</script>
</body>
